<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Home tile: Coloring. A picture of a smiling flower being painted, a paint palette, a brush and a crayon.
       Original art for Little Loops. Transparent background (the tile colour shows through). -->
  <g stroke="#2B2D42" stroke-linecap="round" stroke-linejoin="round">
    <!-- paper with a smiling flower -->
    <g transform="rotate(-6 66 72)">
      <rect x="14" y="12" width="104" height="120" rx="10" fill="#FFFFFF" stroke-width="5"/>
      <path d="M66 74 V116" fill="none" stroke-width="5"/>
      <path d="M66 106 C57 94 43 96 39 102 C47 110 59 110 66 106 Z" fill="#3DDC97" stroke-width="4"/>
      <path d="M66 98 C75 86 89 88 93 94 C85 102 73 102 66 98 Z" fill="#3DDC97" stroke-width="4"/>
      <path d="M26 118 Q66 110 106 118" fill="none" stroke-width="4"/>
      <g stroke-width="4">
        <circle cx="66" cy="37" r="12" fill="#FF6B6B"/>
        <circle cx="85" cy="51" r="12" fill="#FFFFFF"/>
        <circle cx="78" cy="73" r="12" fill="#FFFFFF"/>
        <circle cx="54" cy="73" r="12" fill="#FF6B6B"/>
        <circle cx="47" cy="51" r="12" fill="#FF6B6B"/>
      </g>
      <circle cx="66" cy="56" r="15" fill="#FFD166" stroke-width="4"/>
      <circle cx="60.5" cy="53.5" r="2.6" fill="#2B2D42" stroke="none"/>
      <circle cx="71.5" cy="53.5" r="2.6" fill="#2B2D42" stroke="none"/>
      <path d="M60 60 Q66 65 72 60" fill="none" stroke-width="3"/>
    </g>
    <!-- crayon -->
    <g transform="translate(14 176) rotate(-14)">
      <path d="M0 -9 H58 L76 0 L58 9 H0 Q-5 0 0 -9 Z" fill="#9B5DE5" stroke-width="4.5"/>
      <path d="M68 -4 L76 0 L68 4 Z" fill="#2B2D42" stroke-width="3"/>
      <path d="M14 -9 V9 M44 -9 V9" fill="none" stroke-width="3.5"/>
    </g>
    <!-- paint palette (the thumb hole lets the tile colour show through) -->
    <path fill="#FFE2B0" stroke-width="5" fill-rule="evenodd"
      d="M100 146 C100 122 130 112 152 113 C180 114 198 132 196 154 C194 178 168 192 142 191 C120 190 104 182 106 172 C107 166 116 166 116 160 C116 154 100 156 100 146 Z
         M118 148 a7.5 7.5 0 1 0 15 0 a7.5 7.5 0 1 0 -15 0 Z"/>
    <g stroke-width="3.5">
      <circle cx="129" cy="127" r="9.5" fill="#FF6B6B"/>
      <circle cx="154" cy="124" r="9.5" fill="#FFD166"/>
      <circle cx="177" cy="134" r="9.5" fill="#3DDC97"/>
      <circle cx="183" cy="159" r="9.5" fill="#4CC9F0"/>
      <circle cx="161" cy="176" r="9.5" fill="#9B5DE5"/>
      <circle cx="134" cy="176" r="9.5" fill="#FF9F1C"/>
    </g>
    <!-- paint brush, painting a white petal -->
    <g transform="translate(97 57) rotate(-31)">
      <path d="M44 -7 L88 -5 Q94 0 88 5 L44 7 Z" fill="#4CC9F0" stroke-width="4.5"/>
      <rect x="28" y="-9" width="17" height="18" rx="3" fill="#B8BDD0" stroke-width="4.5"/>
      <path d="M1 0 C8 -10 20 -11 29 -8.5 L29 8.5 C20 11 8 10 1 0 Z" fill="#FF6B6B" stroke-width="4.5"/>
    </g>
  </g>
</svg>
